# Publicação no Render (https://render.com): New > Blueprint > selecione este repositório.
# Requer plano pago (Starter) por causa do disco persistente, onde ficam o banco e os comprovantes.
services:
  - type: web
    name: despesas-corp
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /api/health
    disk:
      name: dados
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
